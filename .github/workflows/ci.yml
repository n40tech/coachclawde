name: CI

on:
  push:
    branches: [main]
  pull_request:

# On a PR, a newer push cancels the run before it; runs on main never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No Supabase variables here, so this builds the offline "local mode" app.
      - run: npm run build
