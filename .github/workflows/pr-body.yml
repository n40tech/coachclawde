# Checks the PR carries exactly one release label (feature, fix or internal;
# the Release workflow picks the version from them). Re-runs when a label
# changes. Skipped while the PR is a draft (GitHub counts a skipped check as
# passed), so a PR opened as a draft, labelled, then marked ready never has a
# failed run. A failed or cancelled run blocks the merge even after a later
# run passes, so don't cancel runs here.
name: PR body

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    name: Release label
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/ci/check-pr-body.mjs label
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
