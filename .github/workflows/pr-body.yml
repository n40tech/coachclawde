# Checks the PR carries exactly one release label (feature, fix or internal;
# the Release workflow picks the version from them). Re-runs when a label
# changes; a newer run cancels the one before it, so opening a PR and then
# labelling it doesn't leave a failed run (and a failure email) behind.
name: PR body

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Release label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/ci/check-pr-body.mjs label
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
