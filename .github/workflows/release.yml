# The Release button: Actions → Release → Run workflow (on main).
#
# Ships everything merged to main since the last release:
#   1. works out the version from the merged PRs' labels (scripts/release)
#   2. commits "Release vX.Y.Z" (the version stamp) on top of main, tags it,
#      and points the `production` branch at it; Vercel deploys production
# It holds no database credentials: a release with database or Edge Function
# changes stops until they're applied (ask Claude) and the box is ticked.
# "Dry run" (the default) only reports what would ship.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would ship
        type: boolean
        default: true
      applied:
        description: Database and Edge Function changes applied
        type: boolean
        default: false

concurrency: release

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: What ships
        id: plan
        run: node scripts/release/run-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPLIED: ${{ inputs.applied }}

      - name: Stamp, tag and ship
        if: steps.plan.outputs.version && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          git push --force origin HEAD:production
          echo "Shipped v$VERSION: Vercel is deploying the production branch." >> "$GITHUB_STEP_SUMMARY"
