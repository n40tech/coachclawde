# The Release button: Actions → Release → Run workflow (on main).
#
# Ships everything merged to main since the last release:
#   1. works out the version from the merged PRs' labels (scripts/release)
#   2. applies new database migrations to production
#   3. redeploys the rest-alarm Edge Function if its code changed
#   4. commits "Release vX.Y.Z" (the version stamp) on top of main, tags it,
#      and points the `production` branch at it; Vercel deploys production
# A failed step stops everything after it. "Dry run" (the default) only
# reports what would ship.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what would ship
        type: boolean
        default: true

concurrency: release

permissions:
  contents: write

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: What ships
        id: plan
        run: node scripts/release/run-plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: supabase/setup-cli@v1
        if: steps.plan.outputs.version && (steps.plan.outputs.migrations == 'true' || steps.plan.outputs.functions == 'true')
        with:
          version: 3.4.0

      - name: Database migrations
        if: steps.plan.outputs.version && steps.plan.outputs.migrations == 'true'
        run: |
          [ "$DRY_RUN" = true ] && dry=--dry-run || dry=
          supabase db push --remote="$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes $dry

      - name: Edge Function
        if: steps.plan.outputs.version && steps.plan.outputs.functions == 'true' && !inputs.dry_run
        run: supabase functions deploy rest-alarm --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes

      - name: Stamp, tag and ship
        if: steps.plan.outputs.version && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          git push --force origin HEAD:production
          echo "Shipped v$VERSION: Vercel is deploying the production branch." >> "$GITHUB_STEP_SUMMARY"
