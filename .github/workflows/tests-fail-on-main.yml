# Runs the PR's new and changed tests against main's code: at least one must
# fail there, and no newly named test may already pass there. Labels decide
# whether it applies (manual-test and internal PRs skip it), so it re-runs
# when they change. See scripts/ci/tests-fail-on-main.mjs.
name: Tests fail on main

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A newer run (a push, a label) cancels the one before it.
concurrency:
  group: fail-on-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fail-on-main:
    name: New tests fail on main
    runs-on: ubuntu-latest
    steps:
      # The default pull_request checkout is the PR merged into main:
      # HEAD^1 is main, HEAD is main plus this PR.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/ci/tests-fail-on-main.mjs
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
