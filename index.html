<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Follow the Android/ChromeOS text-size setting (Chrome 146+); iOS is
         handled by lib/dynamicType, which only runs where this isn't used. -->
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <title>Coach Quinn</title>
    <!-- Paint the app's dark background before the stylesheet and script load,
         so reopening the installed app never flashes a white screen. -->
    <style>html,body,#root{background:#07090b;color-scheme:dark}</style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Screen-anchored UI is portalled here, outside the app root: see FixedLayer.tsx -->
    <div id="fixed-layer"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
